# 服务端的两个容器镜像：语音服务端，和通播机队。
#
# 有了它们，部署那台机器上不需要 Go、不需要 Rust、不需要 scp 二进制，也不需要
# 碰私钥权限（见 server/Dockerfile 里那段关于 root 的注释）：
#
#     cd server && cp .env.example .env && docker compose up -d
#
# **两个镜像而不是一个。** 服务端是纯 Go、静态、distroless；机队要 Python
# （edge-tts）和 ffmpeg。合成一个镜像的话，一个转发着所有人语音的进程会平白
# 多出一个 Python 运行时和一整套 Debian 依赖。

name: server image

on:
  push:
    branches: [main]
    # 路径过滤：客户端和别的改动不该重新发一版镜像。
    # 两份一模一样的清单，不用 YAML 锚点：**GitHub Actions 不支持锚点**，
    # 写了会在解析这个文件时就失败。
    paths:
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'
      # 机队的源码。**漏了的话改了机队不会重新出镜像**，而部署那边 pull 到的
      # 还是旧的——没有任何一处会报错。
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/server-image.yml'
      # 机队的源码。**漏了的话改了机队不会重新出镜像**，而部署那边 pull 到的
      # 还是旧的——没有任何一处会报错。
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }} (+ push on main)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: can-voice
            file: server/Dockerfile
            # arm64 一起出：云厂商的 ARM 机型便宜不少，而纯 Go 交叉编译不要钱。
            platforms: linux/amd64,linux/arm64
          - name: can-voice-atis
            file: server/Dockerfile.atis
            # **机队只出 amd64。** 它是 Rust，交叉编译不像 Go 那样白送：
            # buildx 得靠 QEMU 模拟一整次 arm64 的 cargo build，慢十几倍。
            # 等真有人要在 ARM 上跑机队再说。
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      # PR 上只构建不推送：**镜像构建本身就是要验的那件事**，而一个 PR 不该
      # 往 latest 上盖东西。
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 小写固定写死，不用 ${{ github.repository }} 派生：组织名里有大写字母，
          # 而 GHCR 只收小写——派生出来的名字会在 push 那一步才报错。
          images: ghcr.io/jianyuelab-org/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope 按镜像分开。**共用一个 scope 的话两个镜像会互相顶掉对方的
          # 缓存**，表现是每次都全量构建，而没有任何东西报错。
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
