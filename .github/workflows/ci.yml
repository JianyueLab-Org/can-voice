# can-voice 的 CI。这个仓库此前**没有任何 CI 配置**，所以 `-race` 跑不跑纯属惯例
# ——而本分支已经出过一次"在单核 runner 上 5/5 必红"的测试，那是靠人手跑发现的。
#
# 每个 job 各自的理由写在各自底下。把它们拆开而不是串成一条，是为了让失败信息
# 直接说出是哪一类问题：格式、静态检查、并发、单核调度，还是那个搁置着的探针。
#
# actions/* 钉在大版本上（checkout@v7 / setup-go@v7）。v4/v5 跑在 Node 20 上，
# GitHub 每次运行都会打一条弃用警告——那种每次都出现、每次都无害的警告，会把
# 真正要看的那条淹掉。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 和 go.mod 的 toolchain 对齐。写死而不是用 stable：Go 换大版本时 vet 会多出
  # 新检查，那时要的是一次**有意**的升级，不是某天早上 main 突然变红。
  GO_VERSION: '1.27.1'

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # gofmt -l 对格式不对的文件**只是把文件名打出来，退出码仍然是 0**，
      # 所以直接 `run: gofmt -l .` 是一个永远绿的 job。这里显式判空。
      - name: gofmt -l must be empty
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

  test:
    name: go test -race -count=2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # -race 不是可选项。这套代码里有整整一类只在竞态检测器下才会响的钉子
      # （atomicDuration 存在的全部理由就是它——裸 var 在那里是一条实打实的
      # 数据竞争，而第二轮又特意留了一条只在 -race 下咬人的钉子）。一个跳过
      # -race 的 CI 会把它们悄悄作废，而且是静默作废：全绿。
      #
      # -count=2 是为了抓"第二遍就不成立"的测试：进程全局的计数器（router 的
      # nextID 从不重置）、没清干净的 slog.SetDefault、上一条测试留下的
      # goroutine。这个仓库里上面每一样都是真的存在的东西。
      - run: go test ./server/... -race -count=2

  test-single-core:
    name: go test -race (GOMAXPROCS=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # **这个 job 不是多余的。** 本分支出过一条在 GOMAXPROCS=1 下 5/5 必红的
      # 测试（fsdfeed 的并发读者那条，58e55c7 修的），而它在多核上 20/20 全绿。
      # 那次是人手跑出来的——一个只在多核 runner 上跑的 CI 会让同类问题一直
      # 活着，直到某天有人在一台单核机器上跑测试，或者更糟：直到调度在生产上
      # 恰好排成那个顺序。
      #
      # 单独一个 job 而不是在上面那个里多跑一遍：红的时候要一眼看出是**调度**
      # 问题而不是普通的失败。
      - run: GOMAXPROCS=1 go test ./server/... -race

  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # **两样构建前置，缺哪个报的错都指不到原因。**
      #
      # autotools：audiopus_sys 从源码构建 libopus 并静态链接，build.rs 走的是
      # `sh autogen.sh && sh configure && make`。缺了报 "Failed to autogen Opus"。
      #
      # libasound2-dev：cpal 在 Linux 上走 ALSA，缺了报的是
      # "failed to run custom build command for `alsa-sys`"——而 macOS 上 cpal 走
      # CoreAudio，所以这一条**在开发机上永远不会露头**，只有 Linux 才会。
      # 这正是这个 job 第一次跑就抓到的东西。
      #
      # X11 + udev：`can-voice-ptt` 的 rdev 在 Linux 上走 Xlib、gilrs 走 udev。
      # 同样是"只在 Linux 露头"的那一类，所以照上一条的教训一次装齐。
      - run: >
          sudo apt-get update && sudo apt-get install -y
          autoconf automake libtool libasound2-dev
          libx11-dev libxi-dev libxtst-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 三样拆成三步，理由和上面几个 Go job 拆开是同一条：红的时候要一眼看出
      # 是格式、静态检查，还是逻辑。
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # X-Plane 插件跑在 X-Plane 自己的 Python 里，所以分帧那件事两边各有一份
      # 实现，而**只有 Rust 那一侧有单元测试**。两边一旦对不上，表现是插件从
      # 某一帧起再也收不到任何数据、整个天空清空——can-audio 就是这么坏过一次。
      #
      # 放在这个 job 而不是单开一个：金文件是上一步 `cargo test` 生成的，
      # 拆开就要把它提交上来再比对，多一层没必要的间接。
      - name: 插件的分帧要和 Rust 那一侧对得上
        run: python3 apps/xpc/plugin/test_bridge.py

  e2e:
    name: e2e (rust client against the real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: >
          sudo apt-get update && sudo apt-get install -y
          autoconf automake libtool libasound2-dev
          libx11-dev libxi-dev libxtst-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # **这是唯一能发现各层拼接错误的测试**，而两半都在这个仓库里，所以它是
      # 能在 CI 跑的。它已经当场抓到过一个：客户端的信任根没接上——编译通过、
      # 单测全绿，只有真的去打一个自签服务端才会露头。
      #
      # 夹具（两级证书链、Ed25519 密钥对、一张有效 token 和一张过期的）由
      # 那个 fixture 工具一条命令产出，不需要 openssl。
      - run: mkdir -p target/e2e
      - run: go build -o target/e2e/can-voice ./server/cmd/can-voice
      - run: go run ./server/cmd/can-voice-e2e-fixture
      - run: cargo test -p can-voice-client --test e2e
        env:
          CAN_VOICE_E2E: '1'

  # 四个桌面端的 **Rust 侧**，在 Windows 上编一次。
  #
  # 它存在的唯一理由是 `can-voice-sim` 里那段 SimConnect 绑定：它是
  # `#[cfg(windows)]` 的，而别的 job 全在 Linux 上跑，开发机是 macOS ——
  # 也就是说在这个 job 之前，那段代码**在合并之前没有任何东西看过它**。
  #
  # 只 `cargo check` 不 `tauri build`：要的是"这段代码编得过"，而不是一个
  # 安装包。真正的打包在 release.yml 里，它慢得多。
  windows:
    name: windows (四个桌面端编得过)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [controller, atis, xpc, msfs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
      # tauri 的 build.rs 要 frontendDist 存在才肯跑，而这个 job 不构建前端。
      # 给它一个空目录就够——这里验的是 Rust 那一半。
      #
      # 图标那一头不用在这里补：`icons/icon.ico` 是提交在仓库里的。Windows 上
      # tauri-build 要拿它生成资源文件，**没有就直接编译失败**，而在 Linux 和
      # macOS 上它压根不看这个文件——这个 job 第一次跑就是被这一条挡下来的。
      - run: New-Item -ItemType Directory -Force -Path ../dist | Out-Null
        shell: pwsh
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  # 四个桌面端的 Rust 侧，在 Linux 上编一次。
  #
  # 和 windows 那个 job 是同一件事的另一半：**`apps/` 不在 workspace 里**，
  # 所以上面那个 `rust` job 一行客户端代码都不编。Linux 这边要装的系统库比
  # Windows 多得多，而每一条缺了都只在这里露头。
  linux:
    name: linux (四个桌面端编得过)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [controller, atis, xpc, msfs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}/src-tauri
    steps:
      - uses: actions/checkout@v7
      # 三组，缺哪一组报的错都指不到原因：
      #
      # webkit2gtk / gtk / appindicator / rsvg / xdo —— Tauri 自己要的。
      # Tauri 2 用的是 **4.1**，不是 4.0；装错版本报的是找不到 .pc 文件。
      #
      # autotools + libasound2-dev —— audiopus_sys 从源码静态编 libopus，
      # cpal 在 Linux 上走 ALSA。macOS 上 cpal 走 CoreAudio，所以这一条在
      # 开发机上永远不会露头。
      #
      # X11 + udev —— can-voice-ptt 的 rdev 走 Xlib、gilrs 走 udev。
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev
          autoconf automake libtool libasound2-dev
          libx11-dev libxi-dev libxtst-dev libudev-dev pkg-config
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri
      # 和 windows 那个 job 同一个理由：build.rs 要 frontendDist 存在才肯跑。
      - run: mkdir -p ../dist
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  apps:
    name: apps (前端类型检查 + 构建)
    runs-on: ubuntu-latest
    # **这个 job 存在的理由是 workspace 把 apps/ 排除掉了。**
    #
    # 根 Cargo.toml 写着 `exclude = ["apps"]`（两个 Tauri 端各自拖着 wry/webkit
    # 一整棵树，进来的话 `cargo test --workspace` 每次都要构建一个 GUI 工具链），
    # 所以上面那个 rust job **一行客户端代码都不编**。没有这一条的话，两支已经
    # 发出去的客户端在 CI 里是完全没有门的。
    #
    # 这里只跑前端那一半，理由不是偷懒：Rust 侧在 Linux 上要 webkit2gtk 一串
    # 系统库，而它真正要跑的平台是 macOS 和 Windows —— 那件事属于 Task 9 的
    # 三平台打包，和签名一起做才有意义。前端这一半没有系统依赖，而它守着的正是
    # **跨语言那份约定**：`types.ts` 里照着 "Online"、
    # {"Refused":"ProtoUnsupported"} 这些串写判断，改一个 Rust 侧的变体名，
    # Rust 那边照样编译、照样过测试，而界面会安静地落到兜底分支上。
    permissions:
      contents: read
      # **必须显式写。** 工作流顶上的 `permissions: contents: read` 会把
      # GITHUB_TOKEN 的其它权限全部收掉，包括默认有的 packages: read ——
      # 而 can-ui 装在 GitHub Packages 上。缺了就是 401，报的是下载地址，
      # 不是"少了个权限"。
      packages: read
    strategy:
      # 一支红了要能看见另一支是什么状态。它们互不相干，没有理由互相打断。
      fail-fast: false
      matrix:
        app: [controller, atis, xpc, msfs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # --frozen-lockfile：CI 不该顺手升级依赖。锁文件对不上就该红，而不是装
      # 一套和本地不同的东西然后通过。
      #
      # GITHUB_TOKEN 是给 can-ui 用的：GitHub 的 npm registry **即使是公开包
      # 也要求带令牌**。.npmrc 里写的是 `_authToken=${GITHUB_TOKEN}`，那个变量
      # 在安装时才从环境里读，Actions 不会自动把它放进 env。
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `build` 就是 `vue-tsc --noEmit && vite build`。类型检查那一半是重点：
      # 没有它，一个只在模板里出现的类型错误要等到有人打开那个窗口才发现。
      - run: bun run build
