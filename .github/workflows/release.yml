# 四个桌面端的 Windows 安装包，发成一个 GitHub Release。
#
#     gh workflow run release.yml -f version=v27.0.1
#
# 或者推一个 `v*` 标签。
#
# # Windows 和 Linux，还没有 macOS
#
# `can-audio` 现在发的四个客户端**全部只有 Windows**（它的 release.yml 四个 job
# 都是 `runs-on: windows-latest`），所以这两样都是新能力而不是回归。
#
# Linux 这一份不是凑数：X-Plane 本来就有 Linux 版，而管制端和通播端跟模拟器
# 无关。macOS 还没有，缺的是 Developer ID 证书和公证那一套。
#
# # 为什么不签名
#
# 没有证书。Windows 会弹蓝色的"已保护你的电脑"，用户要点"更多信息 → 仍要运行"
# ——和现在的 can-audio 一模一样（它的测试说明里就写着这一句）。**这不是可以
# 悄悄跳过的一步**：release 说明里必须写出来，否则第一批测试者会以为下载到了
# 病毒。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，形如 v27.0.1"
        required: true
      dry_run:
        description: "只打包不发布（验证打包这一段，不动 release）"
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: ${{ matrix.app }} (${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个挂了其余的照打，一次看全问题。
      fail-fast: false
      # 两个平台 × 四个客户端 = 八个包。
      #
      # 没有单独的 product 维度：产品名（audio-for-can 之类）已经在 tauri
      # 打出来的文件名里，这里只需要一个**互不相同**的 artifact 名字——
      # 两个平台上传同名 artifact 会互相覆盖。
      matrix:
        os: [windows-latest, ubuntu-latest]
        app: [controller, atis, xpc, msfs]
    steps:
      - uses: actions/checkout@v7
      # Linux 上 Tauri 要一串系统库，理由见 ci.yml 里 linux 那个 job 的注释。
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev
          autoconf automake libtool libasound2-dev
          libx11-dev libxi-dev libxtst-dev libudev-dev pkg-config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri

      # GITHUB_TOKEN 是给 can-ui 用的：GitHub 的 npm registry 即使是公开包也
      # 要求带令牌。.npmrc 里写的是 ${GITHUB_TOKEN}，Actions 不会自动放进 env。
      - run: bun install --frozen-lockfile
        working-directory: apps/${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tauri build 自己会调 beforeBuildCommand（也就是 bun run build），
      # 所以前端不用单独再跑一遍。
      - run: bun run tauri build
        working-directory: apps/${{ matrix.app }}

      # Windows 上 NSIS 和 MSI 都出：装不上 MSI 的机器不少（组策略、旧的
      # Windows Installer），而 NSIS 那个双击就装。
      - name: 收集产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundle = "apps/${{ matrix.app }}/src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out
      # Linux 上 deb 和 AppImage 都出：deb 给 Debian/Ubuntu，AppImage 给别的
      # 发行版——这个网络的成员装什么发行版我们不知道，只发 deb 等于把一半人
      # 挡在外面。
      - name: 收集产物（Linux）
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-out
          bundle="apps/${{ matrix.app }}/src-tauri/target/release/bundle"
          find "$bundle" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} dist-out/ \;
          ls -lh dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          path: dist-out/*
          if-no-files-found: error

  release:
    needs: build
    # 试跑时只打包不发布——打包那一段和编译是两条不同的路（图标那次就是这么
    # 漏过去的），而验证它不该以切一个版本为代价。
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 摊平目录
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -lh out
      # **X-Plane 的插件也要发出去。** 说明里原本只写"见仓库里
      # apps/xpc/plugin/"——而仓库是私有的，测试者点不进去。装了 xpc-for-can
      # 的人会连上、能说话，然后看不见任何他机，也没有任何东西告诉他缺了什么。
      - name: 打包 X-Plane 插件
        run: |
          mkdir -p plugin/PythonPlugins
          cp apps/xpc/plugin/PI_XpcTraffic.py plugin/PythonPlugins/
          cd plugin && zip -r ../out/xpc-for-can-xplane-plugin.zip PythonPlugins
          cd .. && ls -lh out/xpc-for-can-xplane-plugin.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          # **beta 一律 prerelease。** 一个标着 Latest 的版本会被没在看群的人
          # 当成正式版装上，而这几个包连一次真实服务端都没连过。
          prerelease: true
          generate_release_notes: true
          files: out/*
          body: |
            ## ⚠️ 这是测试版

            这几个客户端**没有连过真实的语音服务端**，也**没有签名**。

            - **Windows 会弹蓝色的"已保护你的电脑"**：点「更多信息」→「仍要运行」。
              这是因为没有数字签名，不是杀毒软件误报。现在的 can-audio 也是这样。
            - **和现在的 Mumble 客户端不通。** 两套语音是两个互不相通的系统，
              同一个频率上不会互相听见。测试时请约好时间，或者同时开着老客户端守听。

            ## 装哪一个

            | 文件 | 给谁 |
            |---|---|
            | `audio-for-can` | 管制员的语音客户端 |
            | `atis-for-can` | 做通播的 |
            | `xpc-for-can` | X-Plane 飞行员 |
            | `msfs-for-can` | MSFS 飞行员 |

            **Windows**：`.exe` 是安装程序，`.msi` 是给有组策略的机器用的，
            装一个就行。

            **Linux**：`.deb` 给 Debian / Ubuntu，`.rpm` 给 Fedora / openSUSE，
            `.AppImage` 给别的发行版（下载后 `chmod +x` 直接跑）。

            > **AppImage 有 77 MB，deb 和 rpm 只有 5 MB。** 差别是 AppImage 把
            > 整个 webkit 运行时打了进去；deb/rpm 用系统自己的。**发行版对得上
            > 就装 deb 或 rpm**，不要因为 AppImage 看起来省事就下那个。

            > **Linux 上的 PTT 只在 X11 下有效。** 全局按键监听走的是 Xlib，
            > 而 Wayland 不允许一个普通程序监听全局按键——在 Wayland 会话里
            > 键盘 PTT 不会响应，手柄 PTT 照常。界面上那个「按住发话」按钮
            > 任何时候都能用。

            还没有 macOS 版，缺的是签名和公证那一套。

            ## 已知还不行的

            - **MSFS 的他机用的是默认机模。** AI 机注入已经接上了，但机型对到
              MSFS 机模标题这一步只认得第一方（Asobo）那十几种——别的机型会顺着
              同族、同类机身退化，最后退到 C172。装了 FSLTL / AIG 这类 AI 机模包
              的人可以自己写一张表放在
              `%LOCALAPPDATA%\msfs-for-can\titles.json`，格式是
              `{"A20N": "你的机模标题"}` 或者 `{"A20N": ["首选", "备选"]}`。
            - **X-Plane 要单独装插件**才看得见他机：下面的
              `xpc-for-can-xplane-plugin.zip`，解压后把 `PythonPlugins/` 整个
              放进 X-Plane 目录的 `Resources/plugins/` 下面（需要先装
              [XPPython3](https://xppython3.readthedocs.io/)）。不装也能连上、
              能说话，只是天上是空的。
            - **通播不出声**：声音由服务端的机队播，客户端这边只做稿子。
