# 四个桌面端的 Windows 安装包，发成一个 GitHub Release。
#
#     gh workflow run release.yml -f version=v27.0.1
#
# 或者推一个 `v*` 标签。
#
# # Windows 和 Linux，还没有 macOS
#
# `can-audio` 现在发的四个客户端**全部只有 Windows**（它的 release.yml 四个 job
# 都是 `runs-on: windows-latest`），所以这两样都是新能力而不是回归。
#
# Linux 这一份不是凑数：X-Plane 本来就有 Linux 版，而管制端和通播端跟模拟器
# 无关。macOS 还没有，缺的是 Developer ID 证书和公证那一套。
#
# # 为什么不签名
#
# 没有证书，而且 2026-09-17 定下来暂不去弄（README 的"平台"一段）。
# Windows 会弹蓝色的"已保护你的电脑"，用户要点"更多信息 → 仍要运行"
# ——和现在的 can-audio 一模一样（它的测试说明里就写着这一句）。**这不是可以
# 悄悄跳过的一步**：release 说明里必须写出来，否则第一批测试者会以为下载到了
# 病毒。那一段在 `.github/release-notes/common.md`，正式版也带着。
#
# # 版本号只从 tag 来
#
# 打包前 `scripts/release-version.ts` 按 tag 改写四个客户端的 `Cargo.toml` /
# `tauri.conf.json` / `package.json`，仓库里那个数只是本地构建的占位。此前 tag
# 只用来打 git tag，和写进包里的版本没有任何联系——而 can-api 报给更新检查的是
# tag，客户端比的是自己编译进去的那个数，两边对不上就永远提示有新版。
#
# 同一个 tag 也决定发不发成预发布：`vXX.YY.ZZ` 里 **`YY = 0` 是测试版**，
# 其余是正式版。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，形如 v27.1.0（次版本为 0 的发成预发布）"
        required: true
      dry_run:
        description: "只打包不发布（验证打包这一段，不动 release）"
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  # 八个构建开始之前先把 tag 校验一遍。形状不对的 tag（`v27.1`、`v27.1.0-rc1`）
  # 在这里就红，而不是等 MSI 那一步在八个 runner 上各红一次。
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # tag 经 env 进来，不直接展开进脚本：workflow_dispatch 的输入是手打的。
      - id: parse
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        # 不写成 `bun … | tee -a`：没写 shell 时是 `bash -e`，不带 pipefail，
        # 脚本拒绝了 tag 也会被 tee 的退出码盖掉，这一步照样绿。
        run: |
          bun scripts/release-version.ts "$TAG" > parsed.txt
          cat parsed.txt
          cat parsed.txt >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.app }} (${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个挂了其余的照打，一次看全问题。
      fail-fast: false
      # 两个平台 × 四个客户端 = 八个包。
      #
      # 没有单独的 product 维度：产品名（audio-for-can 之类）已经在 tauri
      # 打出来的文件名里，这里只需要一个**互不相同**的 artifact 名字——
      # 两个平台上传同名 artifact 会互相覆盖。
      matrix:
        os: [windows-latest, ubuntu-latest]
        app: [controller, atis, xpc, msfs]
    steps:
      - uses: actions/checkout@v7
      # Linux 上 Tauri 要一串系统库，理由见 ci.yml 里 linux 那个 job 的注释。
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev
          autoconf automake libtool libasound2-dev
          libx11-dev libxi-dev libxtst-dev libudev-dev pkg-config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri

      # GITHUB_TOKEN 是给 can-ui 用的：GitHub 的 npm registry 即使是公开包也
      # 要求带令牌。.npmrc 里写的是 ${GITHUB_TOKEN}，Actions 不会自动放进 env。
      - run: bun install --frozen-lockfile
        working-directory: apps/${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 必须在 tauri build 之前：`env!("CARGO_PKG_VERSION")` 是编译期展开的。
      # shell 写明 bash，Windows 上默认是 pwsh，`"$TAG"` 在那边不是环境变量。
      - name: 写入版本号
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: bun scripts/release-version.ts "$TAG" --write

      # tauri build 自己会调 beforeBuildCommand（也就是 bun run build），
      # 所以前端不用单独再跑一遍。
      - run: bun run tauri build
        working-directory: apps/${{ matrix.app }}

      # Windows 上 NSIS 和 MSI 都出：装不上 MSI 的机器不少（组策略、旧的
      # Windows Installer），而 NSIS 那个双击就装。
      - name: 收集产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundle = "apps/${{ matrix.app }}/src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out
      # Linux 上 deb 和 AppImage 都出：deb 给 Debian/Ubuntu，AppImage 给别的
      # 发行版——这个网络的成员装什么发行版我们不知道，只发 deb 等于把一半人
      # 挡在外面。
      - name: 收集产物（Linux）
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-out
          bundle="apps/${{ matrix.app }}/src-tauri/target/release/bundle"
          find "$bundle" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} dist-out/ \;
          ls -lh dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          path: dist-out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    # 试跑时只打包不发布——打包那一段和编译是两条不同的路（图标那次就是这么
    # 漏过去的），而验证它不该以切一个版本为代价。
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 摊平目录
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -lh out
      # **X-Plane 的插件也要发出去。** 说明里原本只写"见仓库里
      # apps/xpc/plugin/"——而仓库是私有的，测试者点不进去。装了 xpc-for-can
      # 的人会连上、能说话，然后看不见任何他机，也没有任何东西告诉他缺了什么。
      #
      # 装好的 xpc-for-can 里也带着一份（tauri.conf.json 的 bundle.resources），
      # 这个 zip 照发：AppImage 里那份只在程序运行时挂着，而且想先装插件、再装
      # 客户端的人也要拿得到。
      - name: 打包 X-Plane 插件
        run: |
          mkdir -p plugin/PythonPlugins
          cp apps/xpc/plugin/PI_XpcTraffic.py plugin/PythonPlugins/
          cd plugin && zip -r ../out/xpc-for-can-xplane-plugin.zip PythonPlugins
          cd .. && ls -lh out/xpc-for-can-xplane-plugin.zip
      # 测试版那一段只在预发布时带上。正式版的正文里写着"这是测试版"，和
      # release 上那个 Latest 标记是互相打架的两句话。
      - name: 拼 release 正文
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          {
            if [ "$PRERELEASE" = true ]; then
              cat .github/release-notes/prerelease.md
              echo
            fi
            cat .github/release-notes/common.md
          } > release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # **预发布与否跟着版本号走，不再一律 prerelease。** `YY = 0` 是测试版：
          # 一个标着 Latest 的测试版会被没在看群的人当成正式版装上。反过来
          # 正式版必须**不是** prerelease——can-api 取的是 `/releases/latest`，
          # 它跳过预发布，一律 prerelease 的话切过去那天下载和更新检查都是 503。
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: out/*
          body_path: release-body.md
