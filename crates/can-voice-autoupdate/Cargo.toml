[package]
name = "can-voice-autoupdate"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# **不进 workspace。** 它依赖 `tauri`，而 tauri 拖着 wry 和 webkit 一整棵树；
# 进来的话 `cargo test --workspace` 每次都要构建一个 GUI 工具链。编译它的是
# apps/*/src-tauri 那四个 `cargo check --all-targets`，CI 里本来就有。

[dependencies]
can-voice-update = { path = "../can-voice-update" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.12.0"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
