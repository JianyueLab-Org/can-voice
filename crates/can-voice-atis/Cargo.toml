[package]
name = "can-voice-atis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "can_voice_atis"
path = "src/lib.rs"

[[bin]]
name = "can-voice-atis"
path = "src/main.rs"

[dependencies]
can-voice-i18n = { path = "../can-voice-i18n" }
can-voice-client = { path = "../can-voice-client" }
can-voice-proto = { path = "../can-voice-proto" }
can-voice-token = { path = "../can-voice-token" }
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "process", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# 测试里手写一个只答一条的 HTTP 服务，理由见 weather.rs 里那段注释。
tokio = { version = "1.52", features = ["rt", "macros", "net", "io-util"] }
