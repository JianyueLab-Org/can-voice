[package]
name = "can-voice-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
can-voice-i18n = { path = "../can-voice-i18n" }
can-voice-client = { path = "../can-voice-client" }
can-voice-proto = { path = "../can-voice-proto" }
can-voice-ptt = { path = "../can-voice-ptt" }
can-voice-settings = { path = "../can-voice-settings" }
can-voice-token = { path = "../can-voice-token" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1.52", features = ["rt", "sync", "macros"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
