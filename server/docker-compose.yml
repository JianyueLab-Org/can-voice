# can-voice 语音服务端，外加服务端通播机队。
#
#     cp .env.example .env     # 填好里面几项
#     docker compose up -d
#     docker compose logs -f
#
# 配置全在 .env 里，没有配置文件——缺任何必需项启动即失败，而不是用一个默认值
# 悄悄跑起来。
#
# **两个服务，不是一个。** can-voice 转发语音，can-voice-atis 把 datafeed 里
# 每一个 _ATIS 席位念出来。机队是语音服务端的一个**普通客户端**——它拿真实成员
# 账号换票、走和所有人一样的那条路，服务端不认识它。这不是为了好看：服务端
# 一个 Opus 依赖都没有（`server/internal/router/fanout.go` 有测试钉着"服务端
# 永远不碰音频"），而合成语音必然要编码音频。

services:
  can-voice:
    # 回滚：.env 里 CAN_VOICE_IMAGE=…:sha-<commit>。空着就是 :latest。
    image: ${CAN_VOICE_IMAGE:-ghcr.io/jianyuelab-org/can-voice:latest}
    # **必须写。** 一个同时声明了 image 和 build 的服务，在本地没有镜像时会
    # **安静地从源码构建**，于是部署上去的东西和 CI 产出的不是同一个。这里没有
    # build，但把策略写明白，免得哪天有人加上。
    pull_policy: always
    container_name: can-voice
    restart: always
    # QUIC 走 UDP。**/udp 不能漏**——漏了的症状是握手超时，和"这个网络封了
    # QUIC"长得一模一样，而那正是最难排查的一类。
    ports:
      - "${CAN_VOICE_PORT:-64738}:64738/udp"
    volumes:
      # 只读挂整个 letsencrypt：live/ 下是软链，指向 archive/，只挂 live 那一层
      # 会得到一堆断掉的链接。
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      CAN_VOICE_ADDR: ":64738"
      CAN_VOICE_TLS_CERT: "/etc/letsencrypt/live/${CAN_VOICE_DOMAIN}/fullchain.pem"
      CAN_VOICE_TLS_KEY: "/etc/letsencrypt/live/${CAN_VOICE_DOMAIN}/privkey.pem"
      CAN_VOICE_API_PUBKEY: "${CAN_VOICE_API_PUBKEY}"
      CAN_VOICE_FSD_FEED: "${CAN_VOICE_FSD_FEED:-https://data.ceruleanavi.net/v1/events}"
      CAN_VOICE_MAX_RX: "${CAN_VOICE_MAX_RX:-32}"
      # 席位后缀兜底半径（海里），逐条覆盖内置那张估出来的表。空着就照用内置值。
      CAN_VOICE_SUFFIX_RANGES: "${CAN_VOICE_SUFFIX_RANGES:-}"
      CAN_VOICE_DEBUG: "${CAN_VOICE_DEBUG:-}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 服务端通播机队。**没有它，全网通播是哑的**——桌面那支 atis-for-can 只挂
  # FSD 席位、发文字，声音不归它管。
  can-voice-atis:
    # 回滚：.env 里 CAN_VOICE_ATIS_IMAGE=…:sha-<commit>。空着就是 :latest。
    image: ${CAN_VOICE_ATIS_IMAGE:-ghcr.io/jianyuelab-org/can-voice-atis:latest}
    pull_policy: always
    container_name: can-voice-atis
    restart: always
    # 不映射端口：它只往外连（datafeed、can-api、语音服务端），没有人连它。
    depends_on:
      - can-voice
    environment:
      # 一个**真实成员账号**。没有保留账号旁路，也没有办法直接塞一张票进来
      # ——`can-voice-token` 的 TokenSource 只有一个要凭据的构造函数，
      # 这是类型层面的事实而不是纪律。
      ATIS_CID: "${ATIS_CID}"
      ATIS_PASSWORD: "${ATIS_PASSWORD}"
      CAN_API_ORIGIN: "${CAN_API_ORIGIN:-https://api.ceruleanavi.net}"
      # **连的是外面那个地址，不是 can-voice:64738。** 票是按域名签的，
      # 而且这样机队走的路和成员完全一样——它连不上的时候，成员也连不上。
      CAN_VOICE_SERVER: "${CAN_VOICE_SERVER:-audio.ceruleanavi.net:64738}"
      CAN_VOICE_SERVER_NAME: "${CAN_VOICE_SERVER_NAME:-audio.ceruleanavi.net}"
      CAN_FSD_DATAFEED: "${CAN_FSD_DATAFEED:-https://data.ceruleanavi.net/v1/data.json}"
      # 下限 5 秒：写坏或者更小机队起不来，不会带着一份不是你写的配置跑下去。
      ATIS_POLL_SECS: "${ATIS_POLL_SECS:-30}"
      # **和 can-audio 播的同两个男声**（`server/ATIS/mumble.py:317,324`）。
      # 这两行和机队的 DEFAULT_VOICE_* 是同一组值，改一处要改两处——留在这里
      # 是因为 compose 的默认值会盖过 Rust 那一侧，只改常量线上听到的不会变。
      ATIS_VOICE_EN: "${ATIS_VOICE_EN:-en-US-ChristopherNeural}"
      ATIS_VOICE_ZH: "${ATIS_VOICE_ZH:-zh-CN-YunxiNeural}"
      RUST_LOG: "${ATIS_LOG:-info}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
