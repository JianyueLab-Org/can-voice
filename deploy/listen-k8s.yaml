apiVersion: v1
kind: Namespace
metadata:
  name: can-voice-listen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-voice-listen
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: can-voice-listen
  template:
    metadata:
      labels:
        app: can-voice-listen
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/jianyuelab-org/can-voice-listen:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: CAN_VOICE_SERVER
              value: audio.ceruleanavi.net:64738
            - name: CAN_API_ORIGIN
              value: http://app.can-api.svc.cluster.local
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-voice-listen
spec:
  selector:
    app: can-voice-listen
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-voice-listen
  namespace: can-voice-listen
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: listen.ceruleanavi.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
