[package]
name = "xpc-for-can"
version = "27.0.2"
edition = "2021"
rust-version = "1.80"
description = "Cerulean Aviation Network X-Plane 飞行客户端"

# 产品名是 can-api 固定白名单里的四个之一，改名那边要一起改。

[lib]
name = "xpc_for_can_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
can-voice-app = { path = "../../../crates/can-voice-app" }
can-voice-client = { path = "../../../crates/can-voice-client" }
can-voice-fsd = { path = "../../../crates/can-voice-fsd" }
can-voice-ptt = { path = "../../../crates/can-voice-ptt" }
can-voice-sim = { path = "../../../crates/can-voice-sim" }
can-voice-token = { path = "../../../crates/can-voice-token" }
tauri = { version = "2", features = [] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
