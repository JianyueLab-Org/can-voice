[workspace]

[package]
name = "atis-for-can"
version = "27.0.4"
edition = "2021"
rust-version = "1.80"
description = "Cerulean Aviation Network 通播制作客户端"

# **产品名是固定白名单里的四个之一**（can-api 的下载中转、更新检查、发行资产），
# 改名意味着那边要一起改。见 apps/controller 那份里的同一段。

[lib]
name = "atis_for_can_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
can-voice-i18n = { path = "../../../crates/can-voice-i18n" }
can-voice-atis = { path = "../../../crates/can-voice-atis" }
can-voice-datafeed = { path = "../../../crates/can-voice-datafeed" }
can-voice-fsd = { path = "../../../crates/can-voice-fsd" }
can-voice-settings = { path = "../../../crates/can-voice-settings" }
can-voice-log = { path = "../../../crates/can-voice-log" }
can-voice-update = { path = "../../../crates/can-voice-update" }
can-voice-autoupdate = { path = "../../../crates/can-voice-autoupdate" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.12.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# **和 crates 里那几份写得一字不差。** default-features 一旦没关，reqwest 会在
# rustls 旁边再拉一套 native-tls：二进制里两套 TLS，Linux 包运行时还多依赖一份
# 系统 libssl——而开发机和 CI 都装着它，所以缺它的那台机器是用户的。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
