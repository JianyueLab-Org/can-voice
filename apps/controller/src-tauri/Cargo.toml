[package]
name = "audio-for-can"
version = "27.0.3"
edition = "2021"
rust-version = "1.80"
description = "Cerulean Aviation Network 管制语音客户端"

# **产品名是 `audio-for-can`，而它指的是管制端不是飞行员端。**
# 这四个字符串是 can-api 的固定白名单（下载中转、更新检查、发行资产），
# 改名意味着那边要一起改，白白多一处可能出错的地方。

[lib]
name = "audio_for_can_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
can-voice-app = { path = "../../../crates/can-voice-app" }
can-voice-client = { path = "../../../crates/can-voice-client" }
can-voice-datafeed = { path = "../../../crates/can-voice-datafeed" }
can-voice-ptt = { path = "../../../crates/can-voice-ptt" }
can-voice-token = { path = "../../../crates/can-voice-token" }
can-voice-log = { path = "../../../crates/can-voice-log" }
can-voice-update = { path = "../../../crates/can-voice-update" }
tauri = { version = "2", features = [] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
